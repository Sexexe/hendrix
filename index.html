<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1a1a1a">
<title>SAMPLER HENDRIX 5.0</title>
<script src="https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js"></script>
<script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0f0f0f;color:#e0e0e0;min-height:100vh;padding:env(safe-area-inset-top) 12px env(safe-area-inset-bottom) 12px;overflow-x:hidden;user-select:none;-webkit-user-select:none;touch-action:pan-y}
.container{max-width:650px;margin:0 auto}
.header{position:relative;display:flex;align-items:center;justify-content:center;padding:16px 0 8px 0;border-bottom:1px solid #333;margin-bottom:16px}
.header-left{position:absolute;left:0;top:16px;z-index:10}
.open-left-block{position:absolute;left:0;top:48px;display:flex;flex-direction:column;gap:2px;z-index:10}
.project-name-under-open{font-size:clamp(7px,2vw,9px);color:#888;text-align:left;white-space:nowrap;max-width:80px;overflow:hidden;text-overflow:ellipsis}
.header-center{display:flex;flex-direction:column;align-items:center;gap:6px;flex:1;min-width:0}
.header-title{font-size:18px;font-weight:600;color:#fff;letter-spacing:1px;text-transform:uppercase;text-align:center;white-space:nowrap;max-width:100%}
.about-row{display:flex;align-items:center;justify-content:center;gap:8px;width:100%}
.icon-btn{background:#2a2a2a;border:1px solid #3a3a3a;border-radius:6px;width:32px;height:32px;color:#fff;font-size:16px;font-weight:600;cursor:pointer;transition:all .2s;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.icon-btn:hover:not(:disabled){background:#3a3a3a;border-color:#4a4a4a}
.icon-btn:active:not(:disabled){transform:scale(.95)}
.icon-btn:disabled{opacity:.3;cursor:not-allowed}
.lang-btn{background:#2a2a2a;border:1px solid #3a3a3a;border-radius:6px;padding:3px 4px;color:#fff;font-size:clamp(7px,2vw,10px);font-weight:600;cursor:pointer;transition:all .2s;text-transform:uppercase;letter-spacing:.5px;white-space:nowrap}
.header-action-btn{background:#2a2a2a;border:1px solid #3a3a3a;border-radius:6px;padding:3px 6px;color:#fff;font-size:clamp(7px,2vw,9px);font-weight:600;cursor:pointer;transition:all .2s;text-transform:uppercase;letter-spacing:.5px;white-space:nowrap}
.header-action-btn:hover{background:#3a3a3a;border-color:#4a4a4a}
.header-action-btn:active{transform:scale(.95)}
.save-btn-right{position:absolute;right:0;top:48px;background:#2a2a2a;border:1px solid #3a3a3a;border-radius:6px;padding:3px 6px;color:#fff;font-size:clamp(7px,2vw,9px);font-weight:600;cursor:pointer;transition:all .2s;text-transform:uppercase;letter-spacing:.5px;white-space:nowrap;z-index:10}
.save-btn-right:hover{background:#3a3a3a;border-color:#4a4a4a}
.save-btn-right:active{transform:scale(.95)}
.about-btn{background:#2a2a2a;border:1px solid #3a3a3a;border-radius:6px;padding:6px 12px;color:#fff;font-size:clamp(8px,2.5vw,11px);font-weight:600;cursor:pointer;transition:all .2s;text-transform:uppercase;letter-spacing:.5px;white-space:nowrap;flex-shrink:0}
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.85);backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;z-index:1000;padding:20px}
.modal-overlay.active{display:flex}
.modal{background:#1a1a1a;border:1px solid #333;border-radius:12px;max-width:700px;width:100%;max-height:85vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.modal-header{padding:20px;border-bottom:1px solid #333;display:flex;align-items:center;justify-content:space-between;gap:12px}
.modal-title{font-size:18px;font-weight:600;color:#fff}
.close-btn{background:#2a2a2a;border:1px solid #3a3a3a;border-radius:6px;width:32px;height:32px;color:#fff;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.close-btn:hover{background:#dc2626;border-color:#ef4444}
.modal-content{padding:20px;overflow-y:auto;flex:1;line-height:1.6;color:#ccc;font-size:14px}
.modal-content h1{font-size:22px;color:#fff;margin-bottom:16px;padding-bottom:12px;border-bottom:2px solid #333}
.modal-content h2{font-size:18px;color:#fff;margin-top:24px;margin-bottom:12px}
.modal-content p{margin-bottom:12px}
.modal-content ul{margin-left:20px;margin-bottom:12px}
.modal-content li{margin-bottom:6px}
.modal-content strong{color:#fff}
.modal-content .warning{background:rgba(251,191,36,.1);padding:12px;border-left:3px solid #fbbf24;border-radius:6px;margin:12px 0}
.panel{background:#1a1a1a;border:1px solid #333;border-radius:8px;padding:16px;margin-bottom:12px}
canvas{width:100%;height:200px;background:#0a0a0a;border:1px solid #333;border-radius:6px;cursor:crosshair;display:block;touch-action:none}
.timeline-scroll{width:100%;height:10px;background:#1a1a1a;border-radius:5px;margin-top:8px;cursor:pointer;position:relative;overflow:hidden;display:none}
.timeline-scroll.active{display:block}
.timeline-scroll-bar{height:100%;background:#3a3a3a;border-radius:5px;position:absolute;left:0;top:0}
.timeline-scroll-thumb{height:100%;background:#888;border-radius:5px;position:absolute;cursor:grab;transition:background .2s}
.timeline-scroll-thumb:hover{background:#aaa}
.timeline-scroll-thumb:active{background:#ccc;cursor:grabbing}
.pads{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.pad{aspect-ratio:1;background:#2a2a2a;border:2px solid #3a3a3a;border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:all .1s;position:relative;min-height:0;padding:4px}
.pad:active{transform:scale(.95)}
.pad.active{border-color:#fff;background:#3a3a3a}
.pad.loaded{background:#1a2f1a;border-color:#2d5a2d}
.pad.loaded.active{border-color:#fff;background:#2d4a2d}
.pad.selected{border-color:#d97706;background:#3a2f1a;box-shadow:0 0 0 2px #d97706}
.pad.bpm-select1{border-color:#3b82f6!important;background:rgba(59,130,246,.3)!important;animation:bpmPulse 1s infinite}
.pad.bpm-select2{border-color:#8b5cf6!important;background:rgba(139,92,246,.3)!important;animation:bpmPulse 1s infinite}
@keyframes bpmPulse{0%,100%{box-shadow:0 0 0 0 rgba(59,130,246,.4)}50%{box-shadow:0 0 0 8px rgba(59,130,246,.1)}}
.pad.playing{animation:padPulse .6s infinite}
.pad.locked{opacity:.5;border-style:dashed;border-color:#555;background:#111}
@keyframes padPulse{0%,100%{box-shadow:0 0 0 0 rgba(255,255,255,.3)}50%{box-shadow:0 0 0 6px rgba(255,255,255,.15)}}
.pad-num{font-size:clamp(12px,4vw,20px);font-weight:600;color:#666;line-height:1}
.pad.loaded .pad-num{color:#fff}
.pad-duration{font-size:clamp(8px,2.5vw,10px);color:#888;margin-top:4px;text-align:center;width:100%}
.pad.loaded .pad-duration{color:#aaa}
.lock-icon{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:clamp(10px,3vw,13px);display:none;pointer-events:none;z-index:2}
.pad.locked .lock-icon{display:block}
.transport{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.transport button{background:#2a2a2a;border:1px solid #3a3a3a;border-radius:6px;padding:12px 2px;color:#fff;cursor:pointer;transition:all .1s;min-height:60px;display:flex;align-items:center;justify-content:center;font-weight:600;white-space:normal;word-break:break-word;overflow-wrap:break-word;line-height:1.2;font-size:clamp(10px,3.2vw,16px)}
.transport button:active{transform:scale(.95);background:#3a3a3a}
.transport button:disabled{opacity:.3;cursor:not-allowed}
.transport button.rec{background:#7f1d1d;border-color:#991b1b}
.transport button.rec.active{background:#dc2626;border-color:#ef4444;animation:recPulse 1s infinite}
@keyframes recPulse{0%,100%{opacity:1}50%{opacity:.85}}
.transport button.play{background:#14532d;border-color:#166534}
.transport button.loop{background:#713f12;border-color:#854d0e}
.transport button.loop.active{background:#ca8a04;border-color:#eab308;color:#000}
.transport button.stop{background:#450a0a;border-color:#7f1d1d}
.btn-xl{font-size:clamp(8px,2.8vw,11px)!important;font-weight:400!important;text-transform:uppercase}
.btn-sm{font-size:clamp(9px,3vw,14px)!important;font-weight:400!important;text-transform:uppercase}
.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.actions button,.actions label{background:#2a2a2a;border:1px solid #3a3a3a;border-radius:6px;color:#fff;font-weight:400;cursor:pointer;transition:all .1s;min-height:48px;width:100%;display:flex;align-items:center;justify-content:center;text-align:center;white-space:normal;word-break:break-word;overflow-wrap:break-word;line-height:1.2;font-size:clamp(8px,2.8vw,11px);padding:6px 2px;text-transform:uppercase}
.actions button:active,.actions label:active{transform:scale(.95);background:#3a3a3a}
.actions button:disabled{opacity:.3;cursor:not-allowed}
.actions button.merge{background:#713f12;border-color:#854d0e}
.actions button.merge.active{background:#ca8a04;border-color:#eab308;color:#000}
.actions button.bpm-sync{background:#2563eb;border-color:#3b82f6;animation:bpmPulse 2s infinite}
.actions button.bpm-sync.active{background:#1d4ed8;box-shadow:0 0 20px rgba(37,99,235,.6)}
.actions button.rec-mix{background:#7f1d1d;border-color:#991b1b}
.actions button.rec-mix.active{background:#dc2626;animation:recPulse 1s infinite}
.actions button.ad-btn{background:#166534;border-color:#15803d}
input[type=file]{display:none}
.status{text-align:center;color:#888;font-size:12px;margin-top:12px;min-height:18px;white-space:normal;word-wrap:break-word}
.effects{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.effect{background:#141414;border-radius:6px;padding:12px;border:1px solid #2a2a2a}
.effect-label{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-size:clamp(9px,2.5vw,11px);font-weight:600;color:#888;text-transform:uppercase;letter-spacing:.5px;white-space:nowrap}
.effect-value{color:#fff;font-size:clamp(11px,3vw,13px);font-weight:600;white-space:nowrap}
.effect input[type=range]{width:100%;height:5px;border-radius:3px;background:#333;outline:none;-webkit-appearance:none;appearance:none;cursor:pointer}
.effect input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:#fff;cursor:pointer;border:2px solid #000}
.toggle{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:clamp(9px,2.5vw,11px);color:#888;white-space:nowrap}
.toggle input{width:16px;height:16px;cursor:pointer;accent-color:#fff}
.selection-info{text-align:center;color:#666;font-size:11px;margin-top:8px;min-height:16px}
.mode-indicator{text-align:center;color:#d97706;font-size:11px;margin-bottom:8px;min-height:16px;font-weight:600}
.rec-indicator{display:none;align-items:center;justify-content:center;gap:10px;padding:10px;background:rgba(220,38,38,.1);border:1px solid #7f1d1d;border-radius:6px;margin-top:10px;font-size:12px;color:#f87171;font-weight:600}
.rec-indicator.active{display:flex}
.rec-dot{width:10px;height:10px;border-radius:50%;background:#dc2626;animation:recDotPulse 1s infinite}
@keyframes recDotPulse{0%,100%{opacity:1}50%{opacity:.5}}
.rec-level{flex:1;height:6px;background:#333;border-radius:3px;overflow:hidden}
.rec-level-bar{height:100%;background:linear-gradient(90deg,#22c55e,#eab308,#ef4444);width:0%;transition:width .05s}
.slot-indicator{text-align:center;color:#fff;font-size:13px;font-weight:600;margin-bottom:10px;padding:8px;background:#2a2a2a;border-radius:6px;border:1px solid #3a3a3a;white-space:nowrap}
.context-menu{position:fixed;background:#1a1a1a;border:1px solid #3a3a3a;border-radius:6px;box-shadow:0 4px 12px rgba(0,0,0,.5);z-index:1000;display:none;min-width:150px}
.context-menu.active{display:block}
.context-menu-item{padding:10px 16px;cursor:pointer;font-size:13px;color:#e0e0e0;text-transform:uppercase;font-weight:400}
.context-menu-item:hover{background:#2a2a2a}
.context-menu-item.disabled{opacity:.3;cursor:not-allowed}
.zoom-row{display:flex;justify-content:center;gap:8px;align-items:center;margin-top:8px}
#viewModeBtn{font-weight:300!important}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="header-left">
      <button class="lang-btn" id="langBtn" onclick="toggleLang()">RU</button>
    </div>
    <div class="open-left-block">
      <button class="header-action-btn" onclick="openProject()"><span data-i18n="open">ОТКРЫТЬ</span></button>
      <div class="project-name-under-open" id="projectNameDisplay">samplerx.sx</div>
    </div>
    <button class="save-btn-right" onclick="saveProject()"><span data-i18n="saveBtn">СОХРАНИТЬ</span></button>
    <input type="file" id="projectFileInput" accept=".sx" style="display:none">
    <div class="header-center">
      <span class="header-title">SAMPLER HENDRIX 5.0</span>
      <div class="about-row">
        <button class="icon-btn" id="undoBtn" onclick="undo()" disabled>←</button>
        <button class="about-btn" onclick="openAbout()"><span data-i18n="about">ИНФО</span></button>
        <button class="icon-btn" id="redoBtn" onclick="redo()" disabled>→</button>
      </div>
    </div>
  </div>
  <div class="modal-overlay" id="aboutModal">
    <div class="modal">
      <div class="modal-header"><div class="modal-title"><span data-i18n="aboutTitle">ИНФО</span></div><button class="close-btn" onclick="closeAbout()">×</button></div>
      <div class="modal-content" id="modalContent"></div>
    </div>
  </div>
  <div class="panel">
    <div style="display:flex;justify-content:center;margin-bottom:8px;">
      <button id="viewModeBtn" class="icon-btn" style="width:100%;padding:8px;font-size:14px;text-transform:uppercase;text-align:center;" onclick="toggleViewMode()"><span data-i18n="sample">СЭМПЛ</span></button>
    </div>
    <canvas id="wave"></canvas>
    <div class="timeline-scroll" id="timelineScroll">
      <div class="timeline-scroll-bar" id="timelineScrollBar"></div>
      <div class="timeline-scroll-thumb" id="timelineScrollThumb"></div>
    </div>
    <div class="zoom-row">
      <button class="icon-btn" onclick="changeZoom(-0.1)">➖</button>
      <span id="zoomVal" style="font-size:12px;color:#888;min-width:50px;text-align:center;">100%</span>
      <button class="icon-btn" onclick="changeZoom(0.1)">➕</button>
    </div>
    <div class="selection-info" id="selInfo"><span data-i18n="tapDrag">Нажмите и перетащите для выбора</span></div>
  </div>
  <div class="panel">
    <div class="mode-indicator" id="modeIndicator"></div>
    <div class="pads" id="pads"></div>
  </div>
  <div class="panel">
    <div class="transport">
      <button id="recBtn" class="rec">🎤 <span data-i18n="microphone">MIC</span></button>
      <button id="playBtn" class="play" disabled>▶</button>
      <button id="loopBtn" class="loop btn-sm" disabled><span data-i18n="loop">ЦИКЛ</span></button>
      <button id="stopBtn" class="stop" disabled>■</button>
    </div>
    <div class="rec-indicator" id="recIndicator"><div class="rec-dot"></div><span id="recTime">0:00</span><div class="rec-level"><div class="rec-level-bar" id="recLevel"></div></div></div>
    <div class="actions">
      <label for="fileInput" id="loadBtn" class="btn-xl">📂  <span data-i18n="load">Загрузить</span></label>
      <input type="file" id="fileInput" accept="audio/wav,audio/mp3,audio/mpeg,audio/ogg,audio/aac,audio/flac,audio/webm,audio/mp4,audio/x-m4a,audio/aiff,audio/x-aiff,.wav,.mp3,.ogg,.flac,.aac,.m4a,.aiff">
      <button id="trimBtn" class="btn-xl" disabled>✂  <span data-i18n="chop">Обрезать</span></button>
      <button id="saveProjectBtn2" class="btn-xl">💾  <span data-i18n="saveProjectBtn">СОХРАНИТЬ ПРОЕКТ</span></button>
      <button id="recMixBtn" class="rec-mix btn-xl">⏺  <span data-i18n="recMix">Запись микса</span></button>
      <button id="mergeBtn" class="merge btn-xl" disabled>  <span data-i18n="merge">Объединить</span></button>
      <button id="bpmSyncBtn" class="bpm-sync btn-xl" onclick="toggleBpmSync()">🎵  <span data-i18n="bpmSync">СИНХ BPM</span></button>
      <button id="clearBtn" class="btn-xl" disabled>🗑  <span data-i18n="clear">Очистить</span></button>
      <button id="adBtn" class="ad-btn btn-xl" onclick="unlockNextSlot()">🎁  <span data-i18n="bonus">Бонус</span></button>
    </div>
    <div class="status" id="status"><span data-i18n="loadOrRecord">Загрузите аудио или запишите</span></div>
  </div>
  <div class="panel">
    <div class="slot-indicator" id="slotIndicator"><span data-i18n="slot">Слот</span> 1</div>
    <div class="effects">
      <div class="effect"><div class="effect-label"><span data-i18n="tempo">Темп</span><span class="effect-value" id="tempoVal">1.00x</span></div><input type="range" id="tempo" min="0.25" max="4" step="0.01" value="1"></div>
      <div class="effect"><div class="effect-label"><span data-i18n="pitch">Тон</span><span class="effect-value" id="pitchVal">0 ct</span></div><input type="range" id="pitch" min="-1200" max="1200" step="1" value="0"></div>
      <div class="effect"><div class="effect-label"><span data-i18n="volume">Громкость</span><span class="effect-value" id="volVal">100%</span></div><input type="range" id="vol" min="0" max="1" step="0.01" value="1"></div>
      <div class="effect"><div class="effect-label"><span data-i18n="pan">Панорама</span><span class="effect-value" id="panVal">C</span></div><input type="range" id="pan" min="-1" max="1" step="0.01" value="0"></div>
      <div class="effect"><div class="effect-label"><span data-i18n="filter">Фильтр</span><span class="effect-value" id="filtVal"><span data-i18n="off">Выкл</span></span></div><input type="range" id="filt" min="100" max="16000" step="100" value="1000"><div class="toggle"><input type="checkbox" id="filtOn"><label for="filtOn">LPF</label></div></div>
      <div class="effect"><div class="effect-label"><span data-i18n="distortion">Дисторшн</span><span class="effect-value" id="distVal">0</span></div><input type="range" id="dist" min="0" max="100" step="1" value="0"></div>
      <div class="effect"><div class="effect-label"><span data-i18n="delay">Задержка</span><span class="effect-value" id="delVal">0 ms</span></div><input type="range" id="del" min="0" max="1000" step="10" value="0"></div>
      <div class="effect"><div class="effect-label"><span data-i18n="reverb">Реверб</span><span class="effect-value" id="revVal">0%</span></div><input type="range" id="rev" min="0" max="1" step="0.01" value="0"></div>
      <div class="effect"><div class="effect-label"><span data-i18n="tremolo">Тремоло</span><span class="effect-value" id="tremVal">0%</span></div><input type="range" id="trem" min="0" max="1" step="0.01" value="0"></div>
      <div class="effect"><div class="effect-label"><span data-i18n="invert">Инверт</span><span class="effect-value" id="invertVal"><span data-i18n="off">Выкл</span></span></div><div class="toggle"><input type="checkbox" id="invertOn"><label for="invertOn"><span data-i18n="reverse">Реверс</span></label></div></div>
    </div>
  </div>
</div>
<div class="context-menu" id="contextMenu">
  <div class="context-menu-item" onclick="ctxCopy()" data-i18n="copy">Копировать</div>
  <div class="context-menu-item" onclick="ctxPaste()" data-i18n="paste">Вставить</div>
  <div class="context-menu-item" onclick="ctxDelete()" data-i18n="delete">Удалить</div>
  <div class="context-menu-item" onclick="ctxMove()" data-i18n="move">Двигать</div>
</div>
<script>
let currentLang=localStorage.getItem('samplerLang')||'ru';
let unlockedSlots=[true,true,true,true,true,false,false,false,false,false];
let isAdReady=false,isInterstitialAdReady=false;
let viewMode='sample',viewZoom=1.0;
let timelineOffsetSample=0,timelineOffsetPattern=0;
let patternClipboard=null,selectedPatternSlot=-1;
let isResizing=false,resizeSlotIndex=-1,resizeStartX=0,resizeStartVisualDuration=0;
let volPoints=Array(10).fill(null).map(()=>[{x:0,y:1},{x:0.167,y:1},{x:0.333,y:1},{x:0.5,y:1},{x:0.667,y:1},{x:0.833,y:1},{x:1,y:1}]);
let draggingVolPoint=-1,isDraggingPattern=false,dragPatternSlot=-1,dragPatternStartX=0,dragPatternStartOffset=0;
let pendingMoveSlot=-1,patternLoopTimer=null,patternStartTime=0;
let bpmSyncMode=false,bpmSelectFirst=-1,previousSampleSlot=0,padDoubleClickSlot=-1;
let selectedSlots=new Set(),currentProjectName='samplerx',isDraggingTimeline=false;
let isRecordingMix=false;

const translations={

function cloneBuffer(b){if(!b||!audioCtx)return null;const n=audioCtx.createBuffer(b.numberOfChannels,b.length,b.sampleRate);for(let c=0;c<b.numberOfChannels;c++)n.getChannelData(c).set(b.getChannelData(c));return n}
function pushHistory(i){const b=slots[i];if(!b)return;history[i].push(cloneBuffer(b));if(history[i].length>MAX_HISTORY)history[i].shift();redoHistory[i]=[];updUndoRedo()}
function undo(){if(!history[activeSlot].length){setStatus(t('nothingToUndo'));return}const c=slots[activeSlot];if(c)redoHistory[activeSlot].push(cloneBuffer(c));slots[activeSlot]=history[activeSlot].pop();updUndoRedo();drawWave();updatePads();setStatus(t('undo'))}
function redo(){if(!redoHistory[activeSlot].length){setStatus(t('nothingToRedo'));return}const c=slots[activeSlot];if(c){history[activeSlot].push(cloneBuffer(c));if(history[activeSlot].length>MAX_HISTORY)history[activeSlot].shift()}slots[activeSlot]=redoHistory[activeSlot].pop();updUndoRedo();drawWave();updatePads();setStatus(t('redo'))}

  window.addEventListener('pointerdown',w);window.addEventListener('touchstart',w,{passive:true});

function handlePadClick(i,e){
  if(!unlockedSlots[i]){unlockNextSlot();return}
  if(bpmSyncMode){
    if(!slots[i]){setStatus(t('bpmNoSample'));return}
    if(bpmSelectFirst===-1){bpmSelectFirst=i;document.querySelectorAll('.pad')[i].classList.add('bpm-select1');setStatus(t('bpmSelect2'))}
    else if(i===bpmSelectFirst)setStatus(t('bpmSameSlot'));
    else{
      if(!slots[i]){setStatus(t('bpmNoSample'));return}
      document.querySelectorAll('.pad')[i].classList.add('bpm-select2');
      setStatus(' Вычисление BPM...');
      setTimeout(()=>{
        const bpm1=detectBPM(bpmSelectFirst),bpm2=detectBPM(i);
        if(bpm1===0||bpm2===0){setStatus(t('bpmFailed'));resetBpmSync();return}
        const ratio=bpm1/bpm2;
        slotSettings[i].tempo=Math.max(0.25,Math.min(4.0,slotSettings[i].tempo*ratio));
        setStatus(`${t('bpmSynced')}: ${bpm2}→${bpm1} BPM (x${ratio.toFixed(2)})`);
        if(i===activeSlot){$('tempo').value=slotSettings[i].tempo;updateLabelsUI()}
        updatePads();drawWave();saveCurrentSettings();setTimeout(resetBpmSync,2000);
      },100);
    }
    return;
  }
  if(pendingMoveSlot>=0&&viewMode==='pattern'){if(i!==pendingMoveSlot)performMove(pendingMoveSlot,i);pendingMoveSlot=-1;return}
  if(e&&e.shiftKey){if(selectedSlots.has(i))selectedSlots.delete(i);else selectedSlots.add(i);updatePads();updateTransportButtons();updateSelectionInfo();return}
  selectedSlots.clear();saveCurrentSettings();activeSlot=i;selection=null;selectedPatternSlot=-1;loadSlotSettings(i);updatePads();drawWave();updateTransportButtons();updUndoRedo();updateSelectionInfo();updateTimelineScroll()
}

function updateSelectionInfo(){$('modeIndicator').textContent=selectedSlots.size>0?'Выбрано: '+[...selectedSlots].sort((a,b)=>a-b).map(i=>i+1).join(', ')+' (Shift+клик)':''}
function resetBpmSync(){bpmSyncMode=false;bpmSelectFirst=-1;$('bpmSyncBtn').classList.remove('active');document.querySelectorAll('.pad').forEach(p=>p.classList.remove('bpm-select1','bpm-select2'))}
function toggleBpmSync(){if(bpmSyncMode){resetBpmSync();setStatus(t('loadOrRecord'))}else{if(slots.filter(s=>s!==null).length<2){setStatus('Нужно минимум 2 слота');return}bpmSyncMode=true;bpmSelectFirst=-1;$('bpmSyncBtn').classList.add('active');setStatus(t('bpmSelect1'))}}

function detectBPM(slotIndex){
  const buf=slots[slotIndex];if(!buf)return 0;
  const sr=buf.sampleRate,data=buf.getChannelData(0),len=data.length;
  const targetRate=4000,step=Math.max(1,Math.floor(sr/targetRate));
  const ds=[];for(let i=0;i<len;i+=step)ds.push(Math.abs(data[i]));
  if(ds.length<100)return 0;
  let maxA=0;for(let i=0;i<ds.length;i++)if(ds[i]>maxA)maxA=ds[i];
  if(maxA<0.01)return 0;
  const thr=maxA*0.35,minG=Math.floor(targetRate*0.2),maxG=Math.floor(targetRate*2.0);
  const peaks=[];let last=-minG;
  for(let i=1;i<ds.length-1;i++)if(ds[i]>thr&&ds[i]>=ds[i-1]&&ds[i]>=ds[i+1]&&i-last>=minG){peaks.push(i);last=i}
  if(peaks.length<3)return 0;
  const intervals=[];for(let i=1;i<peaks.length;i++){const g=peaks[i]-peaks[i-1];if(g>=minG&&g<=maxG)intervals.push(g)}
  if(intervals.length<2)return 0;
  intervals.sort((a,b)=>a-b);
  const med=intervals[Math.floor(intervals.length/2)];
  const filt=intervals.filter(x=>x>=med*0.5&&x<=med*1.5);
  if(filt.length<2)return 0;
  const avg=filt.reduce((a,b)=>a+b,0)/filt.length;
  let bpm=60/(avg/targetRate);
  while(bpm<60&&bpm<360)bpm*=2;while(bpm>180&&bpm>30)bpm/=2;
  return(bpm<60||bpm>180)?0:Math.round(bpm);
}

function updatePads(){
  document.querySelectorAll('.pad').forEach((p,i)=>{
    p.classList.remove('active','loaded','selected','playing','locked');
    if(!unlockedSlots[i])p.classList.add('locked');
    if(slots[i]){
      p.classList.add('loaded');
      p.querySelector('.pad-duration').textContent=(slots[i].duration/slotSettings[i].tempo).toFixed(1)+'s';
    }else{
      p.querySelector('.pad-duration').textContent='';
    }
    if(i===activeSlot)p.classList.add('active');
    if(selectedSlots.has(i))p.classList.add('selected');
    if(activeChains.has(i))p.classList.add('playing');
  });
}

function resizeCanvas(){const r=canvas.getBoundingClientRect();if(r.width>0&&r.height>0){canvas.width=r.width;canvas.height=r.height;drawWave();updateTimelineScroll()}}
window.addEventListener('resize',resizeCanvas);

function initTimelineScroll(){
  const scroll=$('timelineScroll'),thumb=$('timelineScrollThumb');
  const startDrag=(e)=>{isDraggingTimeline=true;e.preventDefault()};
  const moveDrag=(e)=>{
    if(!isDraggingTimeline)return;e.preventDefault();
    const rect=scroll.getBoundingClientRect();
    const cx=e.touches?e.touches[0].clientX:e.clientX;
    const thumbW=Math.max(40,rect.width*(1/viewZoom));
    const maxLeft=rect.width-thumbW;
    const pct=maxLeft>0?Math.max(0,Math.min(1,(cx-rect.left-thumbW/2)/maxLeft)):0;
    updateTimelineOffset(pct);
  };
  const endDrag=()=>{isDraggingTimeline=false};
  thumb.addEventListener('pointerdown',startDrag);
  scroll.addEventListener('pointerdown',(e)=>{
    if(e.target!==thumb){
      const rect=scroll.getBoundingClientRect();
      const thumbW=Math.max(40,rect.width*(1/viewZoom));
      const maxLeft=rect.width-thumbW;
      const pct=maxLeft>0?Math.max(0,Math.min(1,(e.clientX-rect.left-thumbW/2)/maxLeft)):0;
      updateTimelineOffset(pct);
    }
  });
  window.addEventListener('pointermove',moveDrag);
  window.addEventListener('pointerup',endDrag);
  window.addEventListener('pointercancel',endDrag);
}

function updateTimelineOffset(pct){
  let totalDuration=0;
  if(viewMode==='sample'&&slots[activeSlot])totalDuration=slots[activeSlot].duration;
  else if(viewMode==='pattern'){
    const vis=[];for(let i=0;i<10;i++)if(unlockedSlots[i])vis.push(i);
    totalDuration=Math.max(...vis.map(i=>slots[i]?((slots[i].duration/slotSettings[i].tempo)+Math.max(0,slotSettings[i].offset)):0),10);
  }
  if(totalDuration===0)return;
  const visibleDuration=totalDuration/viewZoom;
  const maxOffset=Math.max(0,totalDuration-visibleDuration);
  const offset=pct*maxOffset;
  if(viewMode==='sample')timelineOffsetSample=offset;
  else timelineOffsetPattern=offset;
  drawWave();updateTimelineScroll();
}

function updateTimelineScroll(){
  const scroll=$('timelineScroll'),bar=$('timelineScrollBar'),thumb=$('timelineScrollThumb');
  let totalDuration=0,currentOffset=0;
  if(viewMode==='sample'&&slots[activeSlot]){
    totalDuration=slots[activeSlot].duration;
    currentOffset=timelineOffsetSample;
  }
  else if(viewMode==='pattern'){
    const vis=[];for(let i=0;i<10;i++)if(unlockedSlots[i])vis.push(i);
    totalDuration=Math.max(...vis.map(i=>slots[i]?((slots[i].duration/slotSettings[i].tempo)+Math.max(0,slotSettings[i].offset)):0),10);
    currentOffset=timelineOffsetPattern;
  }
  if(totalDuration===0){scroll.classList.remove('active');return}
  scroll.classList.add('active');
  const scrollW=scroll.offsetWidth;
  const visibleDuration=totalDuration/viewZoom;
  const thumbW=Math.max(40,scrollW*(visibleDuration/totalDuration));
  const maxOffset=Math.max(0,totalDuration-visibleDuration);
  const currentPct=maxOffset>0?currentOffset/maxOffset:0;

function startDrag(e){
  if(viewMode==='sample'&&slots[activeSlot]){
    const x=getPos(e),y=getYPos(e),W=canvas.width,H=canvas.height;
    for(let i=0;i<volPoints[activeSlot].length;i++){
      const px=volPoints[activeSlot][i].x*W,py=(1-volPoints[activeSlot][i].y)*H;
      if(Math.abs(x-px)<12&&Math.abs(y-py)<12){draggingVolPoint=i;e.preventDefault();return}
    }
    e.preventDefault();isDragging=true;dragStart=x;selection={start:x,end:x};return;
  }
  if(viewMode==='pattern'){
    const x=getPos(e),y=getYPos(e),vis=[];for(let i=0;i<10;i++)if(unlockedSlots[i])vis.push(i);
    const lh=canvas.height/vis.length,li=Math.floor(y/lh);
    if(li>=0&&li<vis.length){
      const si=vis[li];
      if(slots[si]){
        const pps=50*viewZoom,vd=slots[si].duration/slotSettings[si].tempo,bw=Math.max(20,vd*pps);
        const bx=16+slotSettings[si].offset*pps-timelineOffsetPattern*pps;
        if(x>=bx+bw-15&&x<=bx+bw+15){isResizing=true;resizeSlotIndex=si;resizeStartX=x;resizeStartVisualDuration=vd;e.preventDefault();return}
        if(x>=bx&&x<=bx+bw){selectedPatternSlot=si;activeSlot=si;loadSlotSettings(si);isDraggingPattern=true;dragPatternSlot=si;dragPatternStartX=x;dragPatternStartOffset=slotSettings[si].offset;pendingMoveSlot=-1;updatePads();drawWave();e.preventDefault();return}
      }

}

function moveDrag(e){
  if(draggingVolPoint>=0){e.preventDefault();const y=getYPos(e),H=canvas.height;volPoints[activeSlot][draggingVolPoint].y=Math.max(0,Math.min(1,1-y/H));const avg=volPoints[activeSlot].reduce((s,p)=>s+p.y,0)/volPoints[activeSlot].length;slotSettings[activeSlot].vol=avg;$('vol').value=avg;updateLabelsUI();drawWave();return}
  if(isResizing&&resizeSlotIndex>=0){e.preventDefault();const x=getPos(e),dx=x-resizeStartX,pps=50*viewZoom;let nvd=resizeStartVisualDuration+(dx/pps);nvd=Math.max(0.1,Math.min(30,nvd));let nt=slots[resizeSlotIndex].duration/nvd;nt=Math.max(0.25,Math.min(4,nt));slotSettings[resizeSlotIndex].tempo=nt;if(resizeSlotIndex===activeSlot){$('tempo').value=nt;updateLabelsUI()}updateAllChains();updatePads();drawWave();return}
  if(isDraggingPattern&&dragPatternSlot>=0){e.preventDefault();const x=getPos(e),y=getYPos(e),vis=[];for(let i=0;i<10;i++)if(unlockedSlots[i])vis.push(i);const lh=canvas.height/vis.length,li=Math.floor(y/lh);if(li>=0&&li<vis.length){const ts=vis[li];if(ts===dragPatternSlot){slotSettings[dragPatternSlot].offset=dragPatternStartOffset+(x-dragPatternStartX)/(50*viewZoom);drawWave()}else if(ts!==dragPatternSlot){if(slots[ts]){const tb=slots[ts],tst={...slotSettings[ts]},tv=volPoints[ts].map(p=>({...p}));slots[ts]=slots[dragPatternSlot];slotSettings[ts]={...slotSettings[dragPatternSlot]};volPoints[ts]=volPoints[dragPatternSlot].map(p=>({...p}));slots[dragPatternSlot]=tb;slotSettings[dragPatternSlot]=tst;volPoints[dragPatternSlot]=tv}else{slots[ts]=slots[dragPatternSlot];slotSettings[ts]={...slotSettings[dragPatternSlot]};volPoints[ts]=volPoints[dragPatternSlot].map(p=>({...p}));slots[dragPatternSlot]=null;slotSettings[dragPatternSlot]={tempo:1,pitch:0,vol:1,pan:0,filt:1000,filtOn:false,dist:0,del:0,rev:0,trem:0,invert:false,offset:0};volPoints[dragPatternSlot]=[{x:0,y:1},{x:0.167,y:1},{x:0.333,y:1},{x:0.5,y:1},{x:0.667,y:1},{x:0.833,y:1},{x:1,y:1}]}selectedPatternSlot=ts;activeSlot=ts;dragPatternSlot=ts;loadSlotSettings(ts);updatePads();drawWave()}}return}
  if(!isDragging||viewMode!=='sample')return;e.preventDefault();const x=Math.max(0,Math.min(canvas.width,getPos(e)));selection.start=Math.min(dragStart,x);selection.end=Math.max(dragStart,x);drawWave();const b=slots[activeSlot];if(b)$('selInfo').textContent=(selection.start/canvas.width*b.duration).toFixed(2)+'s — '+(selection.end/canvas.width*b.duration).toFixed(2)+'s';

function endDrag(){if(draggingVolPoint>=0){draggingVolPoint=-1;saveCurrentSettings()}if(isResizing){isResizing=false;resizeSlotIndex=-1;saveCurrentSettings()}if(isDraggingPattern){isDraggingPattern=false;dragPatternSlot=-1;saveCurrentSettings()}isDragging=false}

function drawWave(){
  const W=canvas.width,H=canvas.height;if(!W||!H)return;
  ctx.fillStyle='#0a0a0a';ctx.fillRect(0,0,W,H);
  if(viewMode==='sample'){
    const buf=slots[activeSlot];if(!buf)return;
    const data=buf.getChannelData(0),totalSamples=data.length,totalDuration=buf.duration;
    const visibleDuration=totalDuration/viewZoom;
    const startSample=Math.floor((timelineOffsetSample/totalDuration)*totalSamples);
    const visibleSamples=Math.floor((visibleDuration/totalDuration)*totalSamples);
    const amp=H/2;
    ctx.strokeStyle='rgba(255,255,255,0.1)';ctx.lineWidth=1;
    const si2=visibleDuration>10?2:visibleDuration>5?1:0.5;
    for(let s=0;s<=visibleDuration;s+=si2){const x=(s/visibleDuration)*W;ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();ctx.fillStyle='rgba(255,255,255,0.5)';ctx.font='9px sans-serif';ctx.fillText((timelineOffsetSample+s).toFixed(1)+'s',x+2,H-4)}
    if(selection&&selection.end-selection.start>1){ctx.fillStyle='rgba(0,255,0,0.35)';ctx.fillRect(selection.start,0,selection.end-selection.start,H);ctx.strokeStyle='#0f0';ctx.lineWidth=1;ctx.strokeRect(selection.start,0,selection.end-selection.start,H)}
    ctx.strokeStyle='#ffffff';ctx.lineWidth=1.2;ctx.beginPath();
    for(let i=0;i<W;i++){const sampleIndex=startSample+Math.floor((i/W)*visibleSamples),nextSampleIndex=startSample+Math.floor(((i+1)/W)*visibleSamples);let mn=1,mx=-1;for(let j=sampleIndex;j<Math.min(totalSamples,nextSampleIndex);j++){const v=data[j];if(v<mn)mn=v;if(v>mx)mx=v}if(i===0)ctx.moveTo(i,(1+mn)*amp);ctx.lineTo(i,(1+mn)*amp);ctx.lineTo(i,(1+mx)*amp)}
    ctx.stroke();
    ctx.strokeStyle='rgba(251,191,36,0.9)';ctx.lineWidth=2;ctx.beginPath();
    for(let i=0;i<volPoints[activeSlot].length;i++){const px=volPoints[activeSlot][i].x*W,py=(1-volPoints[activeSlot][i].y)*H;if(i===0)ctx.moveTo(px,py);else ctx.lineTo(px,py)}
    ctx.stroke();
    for(let i=0;i<volPoints[activeSlot].length;i++){const px=volPoints[activeSlot][i].x*W,py=(1-volPoints[activeSlot][i].y)*H;ctx.fillStyle=i===draggingVolPoint?'#fff':'#fbbf24';ctx.beginPath();ctx.arc(px,py,5,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#000';ctx.lineWidth=1;ctx.stroke()}
    ctx.fillStyle='#fbbf24';ctx.font='bold 12px sans-serif';ctx.fillText(t('volume'),10,20);
    drawPlayhead();
  } else {
    const vis=[];for(let i=0;i<10;i++)if(unlockedSlots[i])vis.push(i);
    const lh=H/vis.length,pps=50*viewZoom;
    const tdBase=Math.max(...vis.map(i=>slots[i]?((slots[i].duration/slotSettings[i].tempo)+Math.max(0,slotSettings[i].offset)):0),10);
    const vd2=tdBase/viewZoom;
    ctx.strokeStyle='rgba(255,255,255,0.1)';ctx.lineWidth=1;
    const si4=vd2>20?5:vd2>10?2:1;
    for(let s=0;s<=vd2;s+=si4){const x=16+s*pps;if(x>W)break;ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();ctx.fillStyle='rgba(255,255,255,0.5)';ctx.font='9px sans-serif';ctx.fillText((timelineOffsetPattern+s)+'s',x+2,H-4)}
    for(let i=0;i<vis.length;i++){
      const si5=vis[i],y=i*lh;
      ctx.fillStyle=(si5===activeSlot)?'#1a2f1a':'#141414';ctx.fillRect(0,y,W,lh);
      ctx.strokeStyle='#333';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();
      ctx.fillStyle='#666';ctx.font='10px sans-serif';ctx.fillText((si5+1)+'',4,y+14);
      if(slots[si5]){
        const vd3=slots[si5].duration/slotSettings[si5].tempo,bw=Math.max(20,vd3*pps);
        const bx=16+Math.max(0,slotSettings[si5].offset)*pps-timelineOffsetPattern*pps;
        if(bx+bw<0||bx>W)continue;
        const colors=['#2d5a2d','#166534','#14532d','#713f12','#7f1d1d','#450a0a','#3a3a3a','#2a2a2a','#1a1a1a','#0f0f0f'];
        ctx.fillStyle=colors[si5%10];ctx.fillRect(Math.max(0,bx),y+4,Math.min(bw,W-Math.max(0,bx)),lh-8);
        if(si5===selectedPatternSlot){ctx.strokeStyle='#d97706';ctx.lineWidth=3;ctx.strokeRect(Math.max(0,bx),y+4,Math.min(bw,W-Math.max(0,bx)),lh-8)}
        const data=slots[si5].getChannelData(0),st=Math.max(1,Math.ceil(data.length/bw)),wa=(lh-8)/2,cy2=y+4+wa;
        ctx.strokeStyle='rgba(255,255,255,0.7)';ctx.lineWidth=1;ctx.beginPath();
        const df=Math.max(0,bx),dt=Math.min(bx+bw,W);
        for(let px=df;px<dt;px++){let mn=1,mx=-1;const ds=Math.floor(((px-bx)/bw)*data.length);for(let j=ds;j<Math.min(data.length,ds+st);j++){const v=data[j]||0;if(v<mn)mn=v;if(v>mx)mx=v}if(px===df)ctx.moveTo(px,cy2+mn*wa);ctx.lineTo(px,cy2+mn*wa);ctx.lineTo(px,cy2+mx*wa)}
        ctx.stroke();
        ctx.strokeStyle='rgba(251,191,36,0.7)';ctx.lineWidth=1;ctx.beginPath();
        for(let p=0;p<volPoints[si5].length;p++){const px=bx+volPoints[si5][p].x*bw,py=y+4+(1-volPoints[si5][p].y)*(lh-8);if(px<0||px>W)continue;if(p===0)ctx.moveTo(px,py);else ctx.lineTo(px,py)}
        ctx.stroke();
        ctx.fillStyle='#fff';ctx.font='9px sans-serif';ctx.fillText(vd3.toFixed(1)+'s',Math.max(0,bx+4),y+lh-6);
      }
    }
    if(patternStartTime>0){const elapsed=audioCtx.currentTime-patternStartTime;const cursorX=16+(elapsed-timelineOffsetPattern)*pps;if(cursorX>=0&&cursorX<=W){ctx.strokeStyle='rgba(220,38,38,0.25)';ctx.lineWidth=8;ctx.beginPath();ctx.moveTo(cursorX,0);ctx.lineTo(cursorX,H);ctx.stroke();ctx.strokeStyle='#dc2626';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(cursorX,0);ctx.lineTo(cursorX,H);ctx.stroke();ctx.fillStyle='#dc2626';ctx.beginPath();ctx.moveTo(cursorX-6,0);ctx.lineTo(cursorX+6,0);ctx.lineTo(cursorX,10);ctx.closePath();ctx.fill()}}
  }
}

function drawPlayhead(){if(!canvas.width)return;const H=canvas.height;activeChains.forEach((d,si)=>{const pos=getCurPos(d.chain),vd=d.chain.bufferDuration/d.chain.playbackRate,x=((pos-timelineOffsetSample)/vd)*canvas.width;ctx.strokeStyle=si===activeSlot?'#dc2626':'rgba(255,255,255,0.3)';ctx.lineWidth=si===activeSlot?2:1;ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()})}
function getCurPos(c){if(!audioCtx)return 0;const el=audioCtx.currentTime-c.startTime;let p=c.offset+el*c.playbackRate;if(c.loop){const ll=c.loopEnd-c.loopStart;if(ll>0&&p>=c.loopEnd)p=c.loopStart+((p-c.loopStart)%ll)}else if(p>c.bufferDuration)p=c.bufferDuration;return Math.max(0,Math.min(c.bufferDuration,p))}
function renderLoop(){drawWave();if(activeChains.size>0)rafId=requestAnimationFrame(renderLoop);else rafId=null}
function startRenderLoop(){if(!rafId)rafId=requestAnimationFrame(renderLoop)}
function stopRenderLoop(){if(rafId){cancelAnimationFrame(rafId);rafId=null}drawWave()}

function createChain(ac,buf,opts,si){
  const src=ac.createBufferSource();src.buffer=buf;src.loop=opts.loop;src.playbackRate.value=opts.playbackRate;src.detune.value=opts.detune;
  if(opts.loop){src.loopStart=opts.loopStart;src.loopEnd=opts.loopEnd}
  const flt=ac.createBiquadFilter();flt.type='lowpass';flt.frequency.value=opts.filtOn?opts.filt:20000;
  const sh=ac.createWaveShaper();sh.curve=mkDist(opts.dist);sh.oversample='4x';
  const dly=ac.createDelay(2);dly.delayTime.value=Math.max(.001,opts.del/1000);
  const dfb=ac.createGain();dfb.gain.value=.4;const dw=ac.createGain();dw.gain.value=opts.del>0?.5:0;
  const cv=ac.createConvolver();cv.buffer=mkImp(ac,2,2);
  const rw=ac.createGain();rw.gain.value=opts.rev;const rd=ac.createGain();rd.gain.value=1-opts.rev*.5;
  const tg=ac.createGain();tg.gain.value=1;
  const pn=ac.createStereoPanner();pn.pan.value=opts.pan;
  const og=ac.createGain();og.gain.value=opts.vol;
  src.connect(flt);flt.connect(sh);sh.connect(dly);dly.connect(dfb);dfb.connect(dly);dly.connect(dw);
  const ad=ac.createGain();sh.connect(ad);dw.connect(ad);ad.connect(cv);cv.connect(rw);ad.connect(rd);
  const ar=ac.createGain();rw.connect(ar);rd.connect(ar);ar.connect(tg);tg.connect(pn);pn.connect(og);og.connect(ac.destination);
  const now=ac.currentTime;const vp=volPoints[si];
  og.gain.setValueAtTime(vp[0].y*opts.vol,now);
  for(let i=1;i<vp.length;i++){const time=now+vp[i].x*buf.duration/opts.playbackRate;og.gain.linearRampToValueAtTime(vp[i].y*opts.vol,time)}
  const startTime=opts.startAt!==undefined?opts.startAt:now;
  if(opts.loop)src.start(startTime,opts.offset||0);
  else if(opts.offset>0||opts.duration)src.start(startTime,opts.offset,opts.duration);
  else src.start(startTime);
  return{source:src,filter:flt,shaper:sh,delay:dly,delayFb:dfb,delayWet:dw,convolver:cv,revWet:rw,revDry:rd,tremoloGain:tg,panner:pn,outputGain:og,slotIndex:si,startTime:startTime,offset:opts.offset||0,bufferDuration:buf.duration,playbackRate:opts.playbackRate,loop:opts.loop,loopStart:opts.loopStart||0,loopEnd:opts.loopEnd||buf.duration};
}

function updateAllChains(){activeChains.forEach((d,si)=>{const c=d.chain,s=slotSettings[si];c.source.playbackRate.value=s.tempo;c.source.detune.value=s.pitch;c.playbackRate=s.tempo;c.filter.frequency.value=s.filtOn?s.filt:20000;c.shaper.curve=mkDist(s.dist);c.delay.delayTime.value=Math.max(.001,s.del/1000);c.delayWet.gain.value=s.del>0?.5:0;c.revWet.gain.value=s.rev;c.revDry.gain.value=1-s.rev*.5;c.panner.pan.value=s.pan;c.outputGain.gain.value=s.vol})}

function play(loop){
  stopAll();
  if(viewMode==='sample'){
    const buf=slots[activeSlot];if(!buf)return;
    const id=++currentSourceId,s=slotSettings[activeSlot];
    const opts={loop,playbackRate:s.tempo,detune:s.pitch,vol:s.vol,pan:s.pan,filtOn:s.filtOn,filt:s.filt,dist:s.dist,del:s.del,rev:s.rev,trem:s.trem,offset:0,duration:buf.duration,loopStart:0,loopEnd:buf.duration};
    if(selection&&selection.end-selection.start>2){const d=buf.duration,o=selection.start/canvas.width*d,l=(selection.end-selection.start)/canvas.width*d;if(loop){opts.offset=o;opts.loopStart=o;opts.loopEnd=o+l}else{opts.offset=o;opts.duration=Math.min(l,d-o)}}
    const ch=createChain(audioCtx,buf,opts,activeSlot);
    activeChains.set(activeSlot,{chain:ch,id});updatePads();startRenderLoop();
    ch.source.onended=()=>{const d=activeChains.get(activeSlot);if(d&&d.id===id){activeChains.delete(activeSlot);updatePads();if(!activeChains.size){stopRenderLoop();if(isLooping){isLooping=false;$('loopBtn').classList.remove('active')}}}};
  } else {
    let maxEndTime=0;const now=audioCtx.currentTime;patternStartTime=now;
    for(let i=0;i<10;i++){if(!slots[i]||!unlockedSlots[i])continue;const buf=slots[i],s=slotSettings[i],vd=buf.duration/s.tempo,offset=Math.max(0,s.offset),endTime=offset+vd;if(endTime>maxEndTime)maxEndTime=endTime;const id=++currentSourceId;const opts={loop:false,playbackRate:s.tempo,detune:s.pitch,vol:s.vol,pan:s.pan,filtOn:s.filtOn,filt:s.filt,dist:s.dist,del:s.del,rev:s.rev,trem:s.trem,offset:0,duration:buf.duration,loopStart:0,loopEnd:buf.duration,startAt:now+offset};const ch=createChain(audioCtx,buf,opts,i);activeChains.set(i,{chain:ch,id})}
    updatePads();startRenderLoop();
    if(loop&&maxEndTime>0){const loopDuration=maxEndTime*1000;patternLoopTimer=setTimeout(()=>{if(isLooping)play(true)},loopDuration)}
  }
}

function stopSlot(i){const d=activeChains.get(i);if(d){try{d.chain.source.stop()}catch(e){}activeChains.delete(i)}updatePads();if(!activeChains.size)stopRenderLoop()}
function stopAll(){if(patternLoopTimer){clearTimeout(patternLoopTimer);patternLoopTimer=null}activeChains.forEach(d=>{try{d.chain.source.stop()}catch(e){}});activeChains.clear();updatePads();stopRenderLoop();isLooping=false;$('loopBtn').classList.remove('active');patternStartTime=0}
$('playBtn').onclick=()=>{if(isLooping){isLooping=false;$('loopBtn').classList.remove('active');stopAll()}else play(false)};
$('loopBtn').onclick=()=>{if(isLooping){isLooping=false;$('loopBtn').classList.remove('active');stopAll()}else{isLooping=true;$('loopBtn').classList.add('active');play(true)}};
$('stopBtn').onclick=stopAll;

$('fileInput').onchange=async e=>{const f=e.target.files[0];if(!f)return;ensureCtx();setStatus(t('loading'));try{const targetSlot=padDoubleClickSlot>=0?padDoubleClickSlot:activeSlot;pushHistory(targetSlot);slots[targetSlot]=await audioCtx.decodeAudioData(await f.arrayBuffer());if(padDoubleClickSlot>=0){activeSlot=padDoubleClickSlot;padDoubleClickSlot=-1;loadSlotSettings(activeSlot)}selection=null;drawWave();updatePads();updateTransportButtons();updateTimelineScroll();setStatus(t('loadedToSlot')+' '+(activeSlot+1))}catch(er){setStatus(t('errorLoading'))}e.target.value=''};

$('projectFileInput').onchange=async e=>{const f=e.target.files[0];if(!f)return;setStatus('Загрузка проекта...');try{const text=await f.text(),data=JSON.parse(text);if(data.version!=='5.0'){setStatus(t('incompatibleVersion'));return}stopAll();if(data.unlockedSlots)unlockedSlots=data.unlockedSlots;for(let i=0;i<10;i++){if(data.slots&&data.slots[i]&&data.slots[i].buffer){slots[i]=deserializeBuffer(data.slots[i].buffer);slotSettings[i]={...data.slots[i].settings};volPoints[i]=data.slots[i].volPoints.map(p=>({...p}))}else{slots[i]=null;slotSettings[i]={tempo:1,pitch:0,vol:1,pan:0,filt:1000,filtOn:false,dist:0,del:0,rev:0,trem:0,invert:false,offset:0};volPoints[i]=[{x:0,y:1},{x:0.167,y:1},{x:0.333,y:1},{x:0.5,y:1},{x:0.667,y:1},{x:0.833,y:1},{x:1,y:1}]}}currentProjectName=data.projectName||'samplerx';activeSlot=0;selectedSlots.clear();timelineOffsetSample=0;timelineOffsetPattern=0;selection=null;loadSlotSettings(0);updatePads();drawWave();updateTransportButtons();updUndoRedo();updateSelectionInfo();updateTimelineScroll();updateProjectNameDisplay();setStatus(t('projectOpened')+': '+currentProjectName+'.sx')}catch(err){setStatus(t('errorOpeningProject')+': '+err.message)}e.target.value=''};

function serializeBuffer(buf){if(!buf)return null;const channels=[];for(let c=0;c<buf.numberOfChannels;c++)channels.push(Array.from(buf.getChannelData(c)));return{sampleRate:buf.sampleRate,numberOfChannels:buf.numberOfChannels,length:buf.length,duration:buf.duration,channels:channels}}
function deserializeBuffer(data){if(!data)return null;const buf=audioCtx.createBuffer(data.numberOfChannels,data.length,data.sampleRate);for(let c=0;c<data.numberOfChannels;c++)buf.getChannelData(c).set(data.channels[c]);return buf}

async function saveProject(){ensureCtx();const name=prompt(t('projectName')+':',currentProjectName||'samplerx');if(!name||name.trim()==='')return;currentProjectName=name.trim().replace(/\.sx$/i,'');const filename=currentProjectName+'.sx';setStatus(t('processing'));try{const data={version:'5.0',projectName:currentProjectName,unlockedSlots:[...unlockedSlots],slots:slots.map((s,i)=>{if(!s)return null;return{buffer:serializeBuffer(s),settings:{...slotSettings[i]},volPoints:volPoints[i].map(p=>({...p}))}})};const json=JSON.stringify(data);const blob=new Blob([json],{type:'application/json'});downloadBlob(blob,filename);updateProjectNameDisplay();setStatus(t('projectSaved')+': '+filename)}catch(e){setStatus(t('errorExport')+': '+e.message)}}

function downloadBlob(blob,filename){const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=filename;a.style.display='none';document.body.appendChild(a);a.click();setTimeout(()=>{document.body.removeChild(a);URL.revokeObjectURL(url)},2000)}

$('recMixBtn').onclick=async()=>{if(isRecordingMix)return;ensureCtx();isRecordingMix=true;$('recMixBtn').classList.add('active');$('recMixBtn').textContent='⏳ Рендер MP3...';setStatus(t('recordingMix'));try{let maxEndTime=0,hasAudio=false;for(let i=0;i<10;i++){if(slots[i]&&unlockedSlots[i]){hasAudio=true;const vd=slots[i].duration/slotSettings[i].tempo,offset=Math.max(0,slotSettings[i].offset);if(offset+vd>maxEndTime)maxEndTime=offset+vd}}if(!hasAudio){setStatus(t('noValidSlots'));resetMixUI();return}const sr=44100,nc=2,totalDuration=Math.max(maxEndTime+3,2),totalSamples=Math.ceil(totalDuration*sr),oc=new OfflineAudioContext(nc,totalSamples,sr);for(let i=0;i<10;i++){if(!slots[i]||!unlockedSlots[i])continue;const buf=slots[i],s=slotSettings[i],vd=buf.duration/s.tempo,offset=Math.max(0,s.offset);if(offset*s.tempo>=buf.duration)continue;const src=oc.createBufferSource();src.buffer=buf;src.playbackRate.value=s.tempo;src.detune.value=s.pitch;const flt=oc.createBiquadFilter();flt.type='lowpass';flt.frequency.value=s.filtOn?s.filt:20000;const sh=oc.createWaveShaper();sh.curve=mkDist(s.dist);sh.oversample='4x';const dly=oc.createDelay(2);dly.delayTime.value=Math.max(0.001,s.del/1000);const dfb=oc.createGain();dfb.gain.value=0.4;const dw=oc.createGain();dw.gain.value=s.del>0?0.5:0;const cv=oc.createConvolver();cv.buffer=mkImp(oc,1.5,3);const rw=oc.createGain();rw.gain.value=s.rev;const rd=oc.createGain();rd.gain.value=1-s.rev*0.5;const pn=oc.createStereoPanner();pn.pan.value=s.pan;const og=oc.createGain();og.gain.value=s.vol;const vp=volPoints[i];og.gain.setValueAtTime(Math.max(0.001,vp[0].y*s.vol),0);for(let j=1;j<vp.length;j++){const time=Math.min(vp[j].x*vd,totalDuration-0.01);og.gain.linearRampToValueAtTime(Math.max(0.001,vp[j].y*s.vol),time)}src.connect(flt);flt.connect(sh);sh.connect(dly);dly.connect(dfb);dfb.connect(dly);dly.connect(dw);const ad=oc.createGain();sh.connect(ad);dw.connect(ad);ad.connect(cv);cv.connect(rw);ad.connect(rd);const ar=oc.createGain();rw.connect(ar);rd.connect(ar);ar.connect(pn);pn.connect(og);og.connect(oc.destination);src.start(offset)}setStatus('Конвертация в MP3...');const rendered=await oc.startRendering();const mp3Blob=await convertToMP3(rendered);downloadBlob(mp3Blob,'mix_'+(currentProjectName||'samplerx')+'.mp3');setStatus(t('mixRendered'))}catch(e){console.error('Mix render error:',e);setStatus(t('errorExport')+': '+e.message)}finally{resetMixUI()}};

function resetMixUI(){isRecordingMix=false;$('recMixBtn').classList.remove('active');$('recMixBtn').innerHTML='⏺  <span data-i18n="recMix">Запись микса</span>';applyTranslations()}

$('recBtn').addEventListener('click',async function(){try{if(isRecording){if(recTimerInterval)clearInterval(recTimerInterval);if(recMediaRecorder&&recMediaRecorder.state!=='inactive')recMediaRecorder.stop();return}ensureCtx();const stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});recStream=stream;recChunks=[];recMediaRecorder=new MediaRecorder(stream);recMediaRecorder.ondataavailable=e=>{if(e.data.size>0)recChunks.push(e.data)};recMediaRecorder.onstop=async()=>{if(recStream){recStream.getTracks().forEach(t=>t.stop());recStream=null}if(!recChunks.length){setStatus(t('noAudioRecorded'));resetRecUI();return}try{const buf=await audioCtx.decodeAudioData(await new Blob(recChunks,{type:recMediaRecorder.mimeType}).arrayBuffer());pushHistory(activeSlot);slots[activeSlot]=buf;selection=null;drawWave();updatePads();updateTransportButtons();updateTimelineScroll();setStatus(t('recorded')+' '+buf.duration.toFixed(1)+'s')}catch(e){setStatus(t('errorProcessing'))}resetRecUI()};recMediaRecorder.start();isRecording=true;recStartTime=Date.now();$('recBtn').classList.add('active');$('recBtn').innerHTML='🎤 STOP';$('recIndicator').classList.add('active');recTimerInterval=setInterval(()=>{const s=Math.floor((Date.now()-recStartTime)/1000);$('recTime').textContent=Math.floor(s/60)+':'+(s%60+'').padStart(2,'0')},100)}catch(e){setStatus(e.name==='NotAllowedError'?t('micPermissionDenied'):t('micError'));resetRecUI()}});

function resetRecUI(){isRecording=false;$('recBtn').classList.remove('active');$('recBtn').innerHTML='🎤 <span data-i18n="microphone">MIC</span>';applyTranslations();$('recIndicator').classList.remove('active')}

async function convertToMP3(ab){const sr=ab.sampleRate,nc=ab.numberOfChannels,len=ab.length;const enc=new lamejs.Mp3Encoder(nc,sr,128);const l=f32i16(ab.getChannelData(0));const r=nc>1?f32i16(ab.getChannelData(1)):l;const d=[];for(let i=0;i<len;i+=1152){const b=enc.encodeBuffer(l.subarray(i,i+1152),r.subarray(i,i+1152));if(b.length)d.push(b)}const e=enc.flush();if(e.length)d.push(e);return new Blob(d,{type:'audio/mp3'})}
function f32i16(f){const i=new Int16Array(f.length);for(let x=0;x<f.length;x++){const s=Math.max(-1,Math.min(1,f[x]));i[x]=s<0?s*0x8000:s*0x7FFF}return i}
function mkDist(a){const k=a,n=44100,c=new Float32Array(n),d=Math.PI/180;for(let i=0;i<n;i++){const x=i*2/n-1;c[i]=(3+k)*x*20*d/(Math.PI+k*Math.abs(x))}return c}
function mkImp(ac,dur,dec){const r=ac.sampleRate,l=Math.max(1,Math.floor(r*dur));const i=ac.createBuffer(2,l,r);for(let c=0;c<2;c++){const ch=i.getChannelData(c);for(let x=0;x<l;x++)ch[x]=(Math.random()*2-1)*Math.pow(1-x/l,dec)}return i}

$('trimBtn').onclick=()=>{const b=slots[activeSlot];if(!b||!selection||selection.end-selection.start<2){setStatus(t('selectSliceFirst'));return}const s=Math.floor(selection.start/canvas.width*b.length),e=Math.floor(selection.end/canvas.width*b.length),nl=Math.max(1,e-s);pushHistory(activeSlot);const nb=audioCtx.createBuffer(b.numberOfChannels,nl,b.sampleRate);for(let c=0;c<b.numberOfChannels;c++){const src=b.getChannelData(c),dst=nb.getChannelData(c);for(let i=0;i<nl;i++)dst[i]=src[s+i]||0}slots[activeSlot]=nb;selection=null;drawWave();updatePads();setStatus(t('chopped'))};
$('clearBtn').onclick=()=>{if(slots[activeSlot]){pushHistory(activeSlot);stopSlot(activeSlot);slots[activeSlot]=null;selection=null;drawWave();updatePads();updateTransportButtons();setStatus(t('slotCleared'))}};
$('mergeBtn').onclick=()=>{if(selectedSlots.size<2){setStatus(t('selectSliceFirst'));return}const idx=[...selectedSlots].sort((a,b)=>a-b),bufs=idx.map(i=>slots[i]).filter(b=>b);if(bufs.length<2){setStatus(t('notEnoughSlots'));return}let ts=slots.findIndex(s=>s===null);if(ts<0){setStatus(t('noFreeSlots'));return}const sr=bufs[0].sampleRate,nc=bufs[0].numberOfChannels,tl=bufs.reduce((s,b)=>s+b.length,0);const m=audioCtx.createBuffer(nc,tl,sr);let off=0;for(const b of bufs){for(let c=0;c<nc;c++)m.getChannelData(c).set(b.getChannelData(c),off);off+=b.length}slots[ts]=m;idx.forEach(i=>{if(i!==ts){slots[i]=null;slotSettings[i]={tempo:1,pitch:0,vol:1,pan:0,filt:1000,filtOn:false,dist:0,del:0,rev:0,trem:0,invert:false,offset:0};volPoints[i]=[{x:0,y:1},{x:0.167,y:1},{x:0.333,y:1},{x:0.5,y:1},{x:0.667,y:1},{x:0.833,y:1},{x:1,y:1}]}});activeSlot=ts;selectedSlots.clear();loadSlotSettings(ts);$('modeIndicator').textContent='';drawWave();updatePads();updateTransportButtons();updateSelectionInfo();updateTimelineScroll();setStatus(t('merged'))};

function updateLabelsUI(){$('tempoVal').textContent=(+$('tempo').value).toFixed(2)+'x';$('pitchVal').textContent=$('pitch').value+' ct';$('volVal').textContent=Math.round($('vol').value*100)+'%';const p=+$('pan').value;$('panVal').textContent=Math.abs(p)<.02?'C':p<0?'L'+Math.round(-p*100):'R'+Math.round(p*100);$('revVal').textContent=Math.round($('rev').value*100)+'%';$('delVal').textContent=$('del').value+' ms';$('distVal').textContent=$('dist').value;$('filtVal').innerHTML=$('filtOn').checked?$('filt').value+' Hz':t('off');$('tremVal').textContent=Math.round($('trem').value*100)+'%';$('invertVal').innerHTML=$('invertOn').checked?t('on'):t('off')}
function updateLabels(){updateLabelsUI();saveCurrentSettings();updateAllChains()}
['tempo','pitch','vol','pan','rev','del','dist','filt','trem'].forEach(id=>$(id).addEventListener('input',updateLabels));
$('filtOn').addEventListener('change',updateLabels);
$('invertOn').addEventListener('change',e=>{const b=slots[activeSlot];if(!b){e.target.checked=false;return}pushHistory(activeSlot);for(let c=0;c<b.numberOfChannels;c++)b.getChannelData(c).reverse();slotSettings[activeSlot].invert=e.target.checked;updateLabelsUI();setStatus(e.target.checked?t('sampleReversed'):t('sampleRestored'))});
function setStatus(msg){$('status').textContent=msg}
function openAbout(){$('aboutModal').classList.add('active');document.body.style.overflow='hidden'}
function closeAbout(){$('aboutModal').classList.remove('active');document.body.style.overflow=''}
$('aboutModal').addEventListener('click',e=>{if(e.target.id==='aboutModal')closeAbout()});

function checkAdReadiness(){if(!window.vkBridge)return;window.vkBridge.send('VKWebAppCheckNativeAds',{ad_format:'reward'}).then(d=>{isAdReady=d.result}).catch(()=>{isAdReady=false})}
function checkInterstitialAdReadiness(){if(!window.vkBridge)return;window.vkBridge.send('VKWebAppCheckNativeAds',{ad_format:'interstitial'}).then(d=>{isInterstitialAdReady=d.result}).catch(()=>{isInterstitialAdReady=false})}
function showInterstitialAd(){if(!window.vkBridge)return;if(!isInterstitialAdReady){checkInterstitialAdReadiness();return}window.vkBridge.send('VKWebAppShowNativeAds',{ad_format:'interstitial'}).then(()=>{setTimeout(checkInterstitialAdReadiness,2000)}).catch(()=>{})}
function unlockNextSlot(){if(!window.vkBridge)return;const i=unlockedSlots.findIndex(u=>!u);if(i<0){setStatus(t('allUnlocked'));return}if(!isAdReady){setStatus(t('adLoadingWait'));checkAdReadiness();return}window.vkBridge.send('VKWebAppShowNativeAds',{ad_format:'reward'}).then(d=>{if(d.result){unlockedSlots[i]=true;updatePads();drawWave();setStatus(t('slotUnlocked')+' '+(i+1));setTimeout(checkAdReadiness,2000)}else setStatus(t('adUnavailable'))}).catch(()=>setStatus(t('adUnavailable')))}
if(window.vkBridge){window.vkBridge.send('VKWebAppInit').then(()=>{checkAdReadiness();checkInterstitialAdReadiness();setInterval(checkAdReadiness,30000);setInterval(checkInterstitialAdReadiness,30000)})}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')showInterstitialAd()});
init();
</script>
